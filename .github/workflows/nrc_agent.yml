name: GNDO NRC Agent

on:
  workflow_dispatch:

  schedule:
    - cron: '0 0 * * *'

jobs:
  collect-nrc-data:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run NRC Agent
        run: |
          python agents/nureg_agent.py

          python agents/rg_agent.py
          
          python agents/srp_agent.py
          
          python agents/cfr_agent.py
          
          python agents/nrc_registry_agent.py

          python agents/ap1000_agent.py

          python agents/apr1400_agent.py

          python agents/crosswalk_agent.py

          python agents/rkg_agent.py

          python agents/rkg_agent_v03.py

          python agents/rkg_agent_v05.py

      - name: Commit Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"

          git add storage/metadata/*.json

          git diff --staged --quiet || \
          git commit -m "Auto update GNDO metadata"

          git push origin HEAD:main --force
